<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Наложение чата Twitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #FFFFFF;
    --meta: #D8D6D0;
    --font-size: 18px;
    --glitch-a: #FF2E6C;
    --glitch-b: #2EE6FF;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    height: 100%;
    font-family: 'Montserrat', sans-serif;
  }

  #chat {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 420px;
    max-width: 100vw;
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    min-height: 100vh;
    gap: 7px;
    text-align: left;
  }

  .msg {
    display: flex;
    align-items: flex-start;
    align-self: flex-start;
    gap: 4px;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    animation: glitchIn 420ms linear both;
  }

  @keyframes glitchIn {
    0% {
      opacity: 0;
      transform: translate(-9px, 0) scaleY(1.5);
      clip-path: inset(8% 0 72% 0);
      filter: brightness(2.2) contrast(1.6);
    }
    8% {
      opacity: 1;
      transform: translate(7px, 0) scaleY(0.75);
      clip-path: inset(62% 0 4% 0);
    }
    16% {
      transform: translate(-6px, 0) scaleY(1.15);
      clip-path: inset(0 0 42% 0);
    }
    24% {
      transform: translate(5px, 0) scaleY(0.95);
      clip-path: inset(32% 0 0 0);
      filter: brightness(1.5) contrast(1.3);
    }
    34% {
      transform: translate(-3px, 0);
      clip-path: inset(0 0 16% 0);
    }
    46% {
      transform: translate(3px, 0);
      clip-path: inset(0);
      filter: brightness(1.1);
    }
    60% { transform: translate(-1.5px, 0); filter: none; }
    75% { transform: translate(1.5px, 0); }
    100% {
      opacity: 1;
      transform: translate(0, 0) scaleY(1);
      clip-path: inset(0);
      filter: none;
    }
  }

  .msg.fading {
    animation: fadeout 500ms ease forwards;
  }
  @keyframes fadeout {
    to { opacity: 0; transform: translateY(-6px); }
  }

  .msg-body { flex: 1; min-width: 0; text-align: left; }

  .msg-head {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    margin-bottom: 1px;
    flex-wrap: wrap;
  }

  .badge-icon {
    width: 20px;
    height: 20px;
    vertical-align: middle;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.85));
  }

  .username {
    font-weight: 800;
    font-size: var(--font-size);
    color: var(--user-color, #fff);
    line-height: 1.15;
    text-align: left;
    text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.4);
    animation: glitchColor 420ms linear;
  }

  /* Мод / вип / стример — вместо плашек светятся своим цветом */
  .msg.role-broadcaster .username,
  .msg.role-moderator .username,
  .msg.role-vip .username {
    text-shadow:
      0 0 10px var(--user-color),
      0 0 3px var(--user-color),
      0 1px 2px rgba(0,0,0,0.9);
  }

  .text {
    font-weight: 500;
    font-size: var(--font-size);
    color: var(--text);
    line-height: 1.35;
    word-wrap: break-word;
    text-align: left;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 0 6px rgba(0,0,0,0.5);
    animation: glitchColor 420ms linear;
  }

  @keyframes glitchColor {
    0%   { text-shadow: -3px 0 var(--glitch-a), 3px 0 var(--glitch-b); }
    15%  { text-shadow: 3px 0 var(--glitch-a), -3px 0 var(--glitch-b); }
    30%  { text-shadow: -2px 0 var(--glitch-a), 2px 0 var(--glitch-b); }
    45%  { text-shadow: 2px 0 var(--glitch-a), -2px 0 var(--glitch-b); }
    62%  { text-shadow: -1px 0 var(--glitch-a), 1px 0 var(--glitch-b); }
    80%  { text-shadow: 1px 0 rgba(255,46,108,0.4), -1px 0 rgba(46,230,255,0.4); }
    100% { text-shadow: 0 0 transparent; }
  }

  .emote {
    height: 1.7em;
    width: auto;
    vertical-align: middle;
    margin: -2px 2px;
    display: inline-block;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.7));
  }

  .status {
    font-family: 'Montserrat', sans-serif;
    color: var(--meta);
    font-size: 13px;
    padding: 8px 0;
    opacity: 0.85;
    text-align: left;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
</style>
</head>
<body>

<div id="chat"></div>

<script>
  // --- Настройки через URL-параметры ---
  // Пример: overlay.html?channel=egrpk&max=60&size=18
  const params = new URLSearchParams(location.search);
  const CHANNEL = (params.get('channel') || 'egrpk').toLowerCase();
  // Сообщения больше не исчезают по таймеру. MAX — это просто предохранитель,
  // чтобы за долгий стрим DOM не рос бесконечно (значение с запасом, выше видимой области).
  const MAX_MESSAGES = parseInt(params.get('max')) || 60;
  const FONT_SIZE = params.get('size') || '18';

  document.documentElement.style.setProperty('--font-size', FONT_SIZE + 'px');

  const chatEl = document.getElementById('chat');
  const sevenTVMap = {};
  const badgeMap = {};

  const ROLE_COLORS = {
    broadcaster: '#FF5C5C',
    moderator: '#5AD18B',
    vip: '#C58CFF'
  };

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function hashColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return `hsl(${hue}, 65%, 62%)`;
  }

  function getRole(tagsBadges) {
    if (!tagsBadges) return null;
    if (tagsBadges.broadcaster) return 'broadcaster';
    if (tagsBadges.moderator) return 'moderator';
    if (tagsBadges.vip) return 'vip';
    return null;
  }

  // Реальные бейджи Twitch (сабскрайбер N месяцев, битсы, турбо, prime и т.д.)
  function renderBadges(tagsBadges) {
    if (!tagsBadges) return '';
    return Object.keys(tagsBadges).map(setId => {
      const version = tagsBadges[setId];
      const set = badgeMap[setId];
      const v = set && set.versions && set.versions[version];
      if (!v) return '';
      const url = v.image_url_2x || v.image_url_1x;
      const title = escapeHtml(v.title || setId);
      return `<img class="badge-icon" src="${url}" alt="${setId}" title="${title}">`;
    }).join('');
  }

  // Подставляет эмодзи 7TV по словам (текст уже без Twitch-эмодзи на этом этапе)
  function renderWithSevenTV(text) {
    if (!text) return '';
    return text.split(/(\s+)/).map(part => {
      if (/^\s+$/.test(part) || part === '') return part;
      if (sevenTVMap[part]) {
        return `<img class="emote" src="${sevenTVMap[part]}" alt="${escapeHtml(part)}">`;
      }
      return escapeHtml(part);
    }).join('');
  }

  // Twitch-эмодзи приходят с точными позициями символов в сообщении (tags.emotes)
  function renderMessage(tags, message) {
    let ranges = [];
    if (tags.emotes) {
      for (const id in tags.emotes) {
        tags.emotes[id].forEach(pos => {
          const [start, end] = pos.split('-').map(Number);
          ranges.push({ start, end, id });
        });
      }
    }
    ranges.sort((a, b) => a.start - b.start);

    let html = '';
    let cursor = 0;
    for (const r of ranges) {
      if (r.start < cursor) continue;
      html += renderWithSevenTV(message.slice(cursor, r.start));
      const url = `https://static-cdn.jtvnw.net/emoticons/v2/${r.id}/default/dark/2.0`;
      html += `<img class="emote" src="${url}" alt="">`;
      cursor = r.end + 1;
    }
    html += renderWithSevenTV(message.slice(cursor));
    return html;
  }

  // Убирает самые старые сообщения только когда их накопилось намного больше,
  // чем вообще может быть видно на экране — это не "исчезновение", а уборка за кулисами.
  function trimOverflow() {
    const excess = chatEl.children.length - MAX_MESSAGES;
    for (let i = 0; i < excess; i++) {
      const oldest = chatEl.children[i];
      if (!oldest || oldest.classList.contains('fading')) continue;
      oldest.classList.add('fading');
      setTimeout(() => oldest.remove(), 500);
    }
  }

  function addMessage(tags, message) {
    const el = document.createElement('div');
    el.className = 'msg';

    const role = getRole(tags.badges);
    const color = role ? ROLE_COLORS[role] : (tags.color || hashColor(tags['display-name'] || tags.username));
    el.style.setProperty('--user-color', color);
    if (role) el.classList.add('role-' + role);

    el.innerHTML = `
      <div class="msg-body">
        <div class="msg-head">
          ${renderBadges(tags.badges)}
          <span class="username">${escapeHtml(tags['display-name'] || tags.username)}</span>
        </div>
        <div class="text">${renderMessage(tags, message)}</div>
      </div>
    `;

    chatEl.appendChild(el);
    trimOverflow();
  }

  // Подтягиваем набор эмодзи 7TV этого канала (без OAuth: через публичные API)
  async function load7TVEmotes(channelId) {
    if (!channelId) return;
    try {
      const setResp = await fetch(`https://7tv.io/v3/users/twitch/${channelId}`);
      if (!setResp.ok) return;
      const data = await setResp.json();
      const emotes = (data && data.emote_set && data.emote_set.emotes) || [];
      emotes.forEach(e => {
        const host = e.data && e.data.host;
        if (!host) return;
        sevenTVMap[e.name] = `https:${host.url}/2x.webp`;
      });
    } catch (err) {
      console.warn('7TV эмодзи не загрузились:', err);
    }
  }

  // Глобальные бейджи + бейджи конкретного канала (сабскрайб-тиры, кастомные битсы)
  async function loadBadges(channelId) {
    try {
      const globalResp = await fetch('https://badges.twitch.tv/v1/badges/global/display');
      const globalData = await globalResp.json();
      Object.assign(badgeMap, globalData.badge_sets || {});
    } catch (err) {
      console.warn('Глобальные бейджи не загрузились:', err);
    }

    if (!channelId) return;
    try {
      const channelResp = await fetch(`https://badges.twitch.tv/v1/badges/channel/${channelId}/display`);
      if (channelResp.ok) {
        const channelData = await channelResp.json();
        Object.assign(badgeMap, channelData.badge_sets || {});
      }
    } catch (err) {
      console.warn('Бейджи канала не загрузились:', err);
    }
  }

  async function resolveChannelId(channel) {
    try {
      const idResp = await fetch(`https://decapi.me/twitch/id/${channel}`);
      const idText = (await idResp.text()).trim();
      if (idText && !isNaN(Number(idText))) return idText;
    } catch (err) {
      console.warn('Не удалось получить ID канала:', err);
    }
    return null;
  }

  async function init() {
    const channelId = await resolveChannelId(CHANNEL);
    load7TVEmotes(channelId);
    loadBadges(channelId);

    const client = new tmi.Client({ channels: [CHANNEL] });

    client.connect().catch(err => {
      const el = document.createElement('div');
      el.className = 'status';
      el.textContent = 'Не удалось подключиться к чату: ' + CHANNEL;
      chatEl.appendChild(el);
      console.error(err);
    });

    client.on('message', (channel, tags, message) => {
      addMessage(tags, message);
    });
  }

  init();
</script>

</body>
</html>
